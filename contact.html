<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Website project template</title>
</head>
<script>
    const loadComponents = (id, url) => {
        fetch(url)
            .then((response) => response.text())
            .then((html) => {
                document.getElementById(id).innerHTML = html;
            });
    }

    window.onload = () => {
        loadComponents('header', 'public/sections/header.html');
        loadComponents('mobile-header', 'public/sections/mobile-navBar.html');
        loadComponents('section1', 'public/sections/page2/section1.html');
        loadComponents('footer', 'public/sections/footer.html');


    }
</script>

<body class="text-[#00672E] ">
    <div id="mobile-header"></div>
    <div id="header"></div>
    <div id="section1"></div>
    <div id="footer"></div>
</body>

</html>
